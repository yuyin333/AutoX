## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
#  org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Mon Jan 23 10:16:46 CST 2017
#systemProp.https.proxyPort=1080
#systemProp.http.proxyHost=127.0.0.1
#org.gradle.jvmargs=-Xms4192m -Xmx2192m -Dfile.encoding=UTF-8
#systemProp.https.proxyHost=127.0.0.1
#systemProp.http.proxyPort=1080
org.gradle.jvmargs=-Xmx4096m  -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
# 注：configuration-cache 目前**不可开启**（2026-10-08 实测），会报 2 个序列化问题：
#   1) :app:buildTemplateApp —— inputs.file(provider { project(":inrt")... }) 捕获了脚本对象；
#      与 org.gradle.configureondemand 互为约束（关掉 on-demand 才敢在配置期取 :inrt 产物）。
#   2) :inrt:mergeTemplateReleaseAssets —— v7_mini 裁剪 codeeditor 的 doLast 闭包捕获脚本对象。
# 要启用需先把这两处改成独立的、带 @InputDirectory 的类型化 Task，属于独立改造，勿顺手打开。


android.useAndroidX=true
# Jetifier 必须保留：本项目自身依赖已全部 AndroidX，但**传递依赖**里仍有一条
# com.android.support:versionedparcelable:28.0.0（关掉即 Duplicate class，与 androidx 版冲突），
# 另有多条 com.android.support:appcompat-v7 / support-v13 旧链条（见 :app:dependencies）。
android.enableJetifier=true
#android.useDeprecatedNdk=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# 注：项目已从含中文的路径迁移到 E:\AutoX-src（纯 ASCII），原 `android.overridePathCheck=true` 补丁已移除。
# 若日后又把工程放在含非 ASCII 字符的路径下，需重新添加该行才能通过 AGP 的路径检查。